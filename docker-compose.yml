services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "false"
      CELERY_ENABLED: "true"
      CELERY_EMAIL_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - media_data:/app/media
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    user: appuser
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  worker:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "false"
      CELERY_ENABLED: "true"
      CELERY_EMAIL_ENABLED: "true"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USE_TLS: "false"
    command: celery -A app.infrastructure.workers.celery_app.celery_app worker -Q linkhub,emails,analytics,maintenance --loglevel=info
    healthcheck:
      test: ["CMD", "python", "-c", "import celery; from app.infrastructure.workers.celery_app import celery_app; print(celery_app.main)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    user: appuser
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  beat:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DEBUG: "false"
      CELERY_ENABLED: "true"
      CELERY_EMAIL_ENABLED: "true"
    command: celery -A app.infrastructure.workers.celery_app.celery_app beat --loglevel=info --pidfile=/tmp/celerybeat.pid --schedule=/tmp/celerybeat-schedule
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from pathlib import Path; import os; pid=int(Path('/tmp/celerybeat.pid').read_text()); os.kill(pid, 0)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - internal
    user: appuser
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linkhub
      POSTGRES_USER: linkhub
      POSTGRES_PASSWORD: linkhub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkhub -d linkhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 2048M
        reservations:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1", "--save", "300", "100"]
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "65534:65534"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1024M

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "472:472"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "admin"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    networks:
      - public
      - internal
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  pg_data:
  grafana_data:
  media_data:
  prometheus_data:
  redis_data:
