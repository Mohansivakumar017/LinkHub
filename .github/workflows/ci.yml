name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVER_PERCENT: 40
  POSTGRES_DSN: postgresql+asyncpg://linkhub:linkhub@localhost:5432/linkhub
  REDIS_DSN: redis://localhost:6379/0
  JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  docker-images:
    runs-on: ubuntu-latest
    needs: compose
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t linkhub-backend:ci ./backend
      - name: Smoke-test backend image imports
        run: |
          docker run --rm linkhub-backend:ci python -c "
          import app.main, app.core.metrics, app.core.middleware, app.core.context
          import app.infrastructure.repositories.admin_repository
          import app.infrastructure.repositories.audit_repository
          print('imports-ok')
          "
      - name: Build frontend image
        run: docker build -t linkhub-frontend:ci ./frontend
      - name: Verify frontend image has production assets
        run: |
          docker run --rm --entrypoint sh linkhub-frontend:ci -c "
          ls /usr/share/nginx/html/index.html && echo 'index-ok'
          "

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [compose, docker-images, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Start the complete Compose stack
        run: docker compose up -d --build db redis migrate api worker beat frontend mailpit
      - name: Wait for API and frontend readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8000/api/v1/ready >/dev/null \
              && curl --fail --silent http://localhost:8080/ >/dev/null \
              && curl --fail --silent http://localhost:8025/api/v1/messages >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --no-color --tail=200 api worker beat frontend
          exit 1
      - name: Verify health endpoints and service state
        run: |
          curl --fail http://localhost:8000/api/v1/health
          curl --fail http://localhost:8000/api/v1/ready
          docker compose ps
      - name: Verify live Redis rate limiting
        run: |
          throttled=0
          for attempt in $(seq 1 25); do
            status=$(curl --silent --output /tmp/rate-limit-response \
              --write-out '%{http_code}' \
              -X POST http://localhost:8000/api/v1/auth/login \
              -H 'Content-Type: application/json' \
              --data '{"email":"ci-rate-limit@example.com","password":"WrongPass123!"}')
            if [ "$status" = "429" ]; then
              throttled=1
              break
            fi
          done
          test "$throttled" = "1"
          grep -q '"code":"rate_limit_exceeded"' /tmp/rate-limit-response
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_MAILPIT_URL: http://localhost:8025
      - name: Collect Compose diagnostics
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 api worker beat frontend migrate
      - name: Tear down Compose stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test -- --run
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkhub
          POSTGRES_USER: linkhub
          POSTGRES_PASSWORD: linkhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkhub -d linkhub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Verify migration round trip
        run: |
          alembic downgrade base
          alembic upgrade head
      - name: Tests with coverage threshold
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=${{ env.MIN_COVER_PERCENT }}
