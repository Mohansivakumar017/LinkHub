name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MIN_COVER_PERCENT: 40
  POSTGRES_DSN: postgresql+asyncpg://linkhub:linkhub@localhost:5432/linkhub
  REDIS_DSN: redis://localhost:6379/0
  JWT_SECRET_KEY: test-secret-key-that-is-at-least-32-characters

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  docker-images:
    runs-on: ubuntu-latest
    needs: compose
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t linkhub-backend:ci ./backend
      - name: Smoke-test backend image imports
        run: |
          docker run --rm linkhub-backend:ci python -c "
          import app.main, app.core.metrics, app.core.middleware, app.core.context
          import app.infrastructure.repositories.admin_repository
          import app.infrastructure.repositories.audit_repository
          print('imports-ok')
          "
      - name: Build frontend image
        run: docker build -t linkhub-frontend:ci ./frontend
      - name: Verify frontend image has production assets
        run: |
          docker run --rm --entrypoint sh linkhub-frontend:ci -c "
          ls /usr/share/nginx/html/index.html && echo 'index-ok'
          "

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkhub
          POSTGRES_USER: linkhub
          POSTGRES_PASSWORD: linkhub
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkhub -d linkhub"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Type check
        run: mypy app
      - name: Apply database migrations
        run: alembic upgrade head
      - name: Tests with coverage threshold
        run: pytest -q --cov=app --cov-report=term --cov-fail-under=${{ env.MIN_COVER_PERCENT }}
