services:
  frontend:
    env_file:
      - ./backend/.env.production

  api:
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      CELERY_ENABLED: "true"
      CELERY_EMAIL_ENABLED: "true"
      RATE_LIMIT_ENABLED: "true"

  migrate:
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"

  worker:
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      CELERY_ENABLED: "true"
      CELERY_EMAIL_ENABLED: "true"

  beat:
    env_file:
      - ./backend/.env.production
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      CELERY_ENABLED: "true"

  db:
    ports: !reset []
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER is required} -d ${POSTGRES_DB:?POSTGRES_DB is required}",
        ]

  redis:
    ports: !reset []
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --save
      - "300"
      - "100"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]

  mailpit:
    profiles: ["local-only"]
    ports: !reset []

  prometheus:
    ports: !reset []

  grafana:
    ports: !reset []
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
